spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/raincatcher_db}
spring.datasource.username=${DB_USERNAME:raincatcher}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

camera.rpi.base-url=${CAMERA_RPI_BASE_URL:http://192.168.100.137:5050}

accuweather.api.key=${ACCUWEATHER_API_KEY:}
accuweather.location=Shah Alam, Selangor, Malaysia
accuweather.location-key=${ACCUWEATHER_LOCATION_KEY:230464}
accuweather.cache-minutes=30

raincatcher.bootstrap.admin-password=${RAINCATCHER_BOOTSTRAP_ADMIN_PASSWORD:}

server.address=0.0.0.0
server.port=8080