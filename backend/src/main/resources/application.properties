spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/raincatcher_db}
spring.datasource.username=${DB_USERNAME:raincatcher}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

camera.rpi.base-url=${CAMERA_RPI_BASE_URL:http://192.168.100.137:5050}
ml.service.base-url=${ML_SERVICE_BASE_URL:http://192.168.100.137:5050}

openai.api.key=${OPENAI_API_KEY:}
openai.enabled=${OPENAI_ENABLED:false}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
openai.responses.url=https://api.openai.com/v1/responses

telegram.enabled=${TELEGRAM_ENABLED:false}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}
telegram.api-url=https://api.telegram.org

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

profile.image.dir=${PROFILE_IMAGE_DIR:/home/raincatcher/raincatcher-backend/profile-images}

app.frontend-base-url=${FRONTEND_BASE_URL:http://192.168.100.130:5173}

accuweather.api.key=${ACCUWEATHER_API_KEY:}
accuweather.location=Shah Alam, Selangor, Malaysia
accuweather.location-key=${ACCUWEATHER_LOCATION_KEY:230464}
accuweather.cache-minutes=30

raincatcher.bootstrap.admin-password=${RAINCATCHER_BOOTSTRAP_ADMIN_PASSWORD:}

server.address=0.0.0.0
server.port=8080

google.login.enabled=${GOOGLE_LOGIN_ENABLED:false}
google.client-id=${GOOGLE_CLIENT_ID:}
